name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The protocol decoding and the theft-detection rules all live in :core, which is a
      # plain JVM module. It is the part worth having a red build over.
      - name: Run core unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # An unsigned APK cannot be sideloaded, and the failure only shows up on the phone.
      # Debug builds are signed with the auto-generated debug keystore; prove it here.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starlink-guard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  # Google Play takes an Android App Bundle, not an APK. This job produces one, signed with
  # the upload key when the repository has the signing secrets and unsigned otherwise, so the
  # build still proves the release variant compiles before any keys exist.
  bundle:
    name: Release bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Report bundle signing state
        run: |
          set -euo pipefail
          aab=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $aab ($(du -h "$aab" | cut -f1))"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "Signed with the upload key."
          else
            echo "::warning::No signing secrets configured - this bundle is UNSIGNED and Play will reject it."
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: starlink-guard-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
