name: Publish to Play

# Deliberately manual. Publishing on every push would create a Play release per commit and
# burn through version codes, so this runs only when you press the button in the Actions tab.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft lets you review in Play Console before it goes live)"
        type: choice
        options: [completed, draft]
        default: completed
      versionCode:
        description: "versionCode to publish. Leave blank to use 100 + this run's number."
        type: string
        required: false

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      # Fail here with a readable message rather than 20 minutes later with an opaque one.
      - name: Check the required secrets exist
        run: |
          set -eo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - see docs/PLAY_RELEASE.md"
            exit 1
          fi
          echo "All signing and Play API secrets are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        run: |
          set -eo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Play needs a strictly increasing versionCode. Deriving it from the run number means
      # repeat publishes cannot collide, and the offset keeps it clear of the low numbers used
      # by the first, manually uploaded release.
      - name: Resolve versionCode
        run: |
          set -eo pipefail
          requested="${{ inputs.versionCode }}"
          if [ -n "$requested" ]; then
            resolved="$requested"
          else
            resolved=$(( 100 + ${{ github.run_number }} ))
          fi
          echo "VERSION_CODE=$resolved" >> "$GITHUB_ENV"
          echo "Publishing versionCode $resolved"

      - name: Build signed release bundle
        run: ./gradlew :app:bundleRelease

      - name: Confirm the bundle is signed
        run: |
          set -eo pipefail
          aab=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $aab ($(du -h "$aab" | cut -f1))"
          # An unsigned bundle is rejected by Play with a confusing error; catch it here.
          if ! unzip -l "$aab" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::Bundle is not signed - check the keystore secrets."
            exit 1
          fi

      # Pinned to the commit behind v1.1.5. This action receives a credential that can publish
      # to your Play account, so it is pinned by SHA rather than by a mutable tag.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.starlinkguard
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: distribution/whatsnew
          # mappingFile: app/build/outputs/mapping/release/mapping.txt   # once R8 is enabled
